<!DOCTYPE html>
<html lang="en-US">

<head>
	<meta charSet="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
	<meta name="description" content="DATA_CORRUPTED - Hendo3's personal site">
	<meta name="keywords" content="Hendo3, personal site, links, terminal, cyberpunk, data_corrupted">
	<meta name="author" content="Belagamba Eduardo">
	<meta name="license" content="MIT">
	<meta name="google-drive-api-key" content="">
	<link rel="icon" type="image/svg+xml" href="./assets/favicon/favicon.svg">
	<link rel="license" href="https://opensource.org/licenses/MIT">
	<link rel="manifest" href="./manifest.webmanifest">
	<link rel="stylesheet" href="./css/styles.css">
	<title>DATA_CORRUPTED</title>
</head>

<body>
	<div id="container">
		<span id="location">
			NODE_CONNECTED // <span id="node-id"></span>
		</span>
		<div id="header">
			<span id="system-status">
				NET: SYNC // <span id="status"></span>
			</span>
			<span id="sync-status" role="status">NET: SYNC</span>
			<span id="clock" aria-label="Local time">00:00:00</span>
		</div>

		<div id="main-grid">
			<div id="link-sectors"></div>

			<div class="sector-rawlogs sector">
				<span class="sector-title">/// SYSTEM LOGS</span>
				<div id="logs" role="region" aria-label="System and command logs" tabindex="0">

				</div>
			</div>
		</div>

		<div id="input-zone">
			<span class="prompt-sign">/// </span>
			<span id="username">hendo: </span>
			<input type="text" aria-label="Command terminal" id="cmd"
				placeholder="help / add media | name | https://..." autocomplete="off" autocapitalize="off" enterkeyhint="go" spellcheck="false" />
		</div>
	</div>
	<script src="./js/script.js"></script>
</body>

</html>
